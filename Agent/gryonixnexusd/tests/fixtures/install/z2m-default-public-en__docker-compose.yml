services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.1
    container_name: zigbee2mqtt
    restart: unless-stopped
    volumes:
      - /opt/zigbee2mqtt/data:/app/data
      # Device names as udev knows them.
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus-if00-port0:/dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus-if00-port0
    # The broker it publishes to and the page it serves are both
    # on the host's own network; published ports would be ignored.
    network_mode: host