services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    restart: unless-stopped
    environment:
      WEBUI_URL: "https://ai.example.com"
      # Session signing key. Generated on the server — regenerating
      # it on every start would sign every existing session out.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: "false"
    volumes:
      - /opt/open-webui/data:/app/backend/data
    ports:
      - "127.0.0.1:8097:8080"
    networks:
      - gryonixnexus-ai
networks:
  gryonixnexus-ai:
    external: true