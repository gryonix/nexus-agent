services:
  shairport-sync:
    image: mikebrady/shairport-sync:classic
    container_name: shairport-sync
    restart: unless-stopped
    # Finding the speaker and streaming to it use the host's network.
    network_mode: host
    devices:
      - /dev/snd
    volumes:
      - ./shairport-sync.conf:/etc/shairport-sync.conf:ro
    command: -a "Living room" -o alsa -- -d hw:1,0